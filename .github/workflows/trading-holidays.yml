# Canonical workflow. GitHub Actions only reads .github/workflows at the
# repository root, so this file is the one that runs when DxFeed is the repo.
# It fetches every calendar the adapters are allowed to fetch:
#   NYSE, NASDAQ, OPRA  — live HTTP
#   CME                 — only files already placed in input/cme/ (no scrape)
name: trading-holidays

on:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      exchanges:
        description: "Comma-separated exchanges"
        default: "NYSE,NASDAQ,OPRA,CME"
        required: false
      upload:
        description: "Upload CSVs to Google Drive when secrets are set"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trading-holidays
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    defaults:
      run:
        working-directory: deliverables/taskA_holidays
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deliverables/taskA_holidays/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Chromium is only the nasdaq.com fallback. nasdaqtrader.com is tried first.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Offline parser tests
        run: python -m pytest tests -q

      - name: Scrape, validate, and upload when credentials exist
        id: run
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHARE_WITH: ${{ vars.GDRIVE_SHARE_WITH }}
          DRY_RUN: ${{ (inputs.upload == false || secrets.GDRIVE_FOLDER_ID == '') && '1' || '' }}
        run: |
          set -o pipefail
          EXCHANGES="${{ inputs.exchanges || 'NYSE,NASDAQ,OPRA,CME' }}"
          for attempt in 1 2 3; do
            if python -m scraper.run --exchanges "$EXCHANGES" --upload 2> >(tee -a run_log.jsonl >&2); then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rc=$?
            # Validation FAIL is a data problem. Do not retry it.
            if [ "$rc" = "1" ]; then
              echo "status=validation_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep $(( (2 ** attempt) * 15 + RANDOM % 10 ))
          done
          echo "status=crashed" >> "$GITHUB_OUTPUT"
          exit 2

      - name: Publish the validation report on the run summary
        if: always()
        run: |
          {
            echo "## Trading-holiday fetch"
            echo
            if [ -f output/run_meta.json ]; then
              echo '```json'
              cat output/run_meta.json
              echo '```'
            fi
            echo
            if [ -f output/validation_report.md ]; then
              cat output/validation_report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save fetched CSVs and raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holidays-${{ github.run_id }}
          path: |
            deliverables/taskA_holidays/output
            deliverables/taskA_holidays/raw
            deliverables/taskA_holidays/run_log.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the fetched calendars
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            deliverables/taskA_holidays/output/trading_holidays_combined.csv
            deliverables/taskA_holidays/output/trading_holidays_NYSE.csv
            deliverables/taskA_holidays/output/trading_holidays_NASDAQ.csv
            deliverables/taskA_holidays/output/trading_holidays_OPRA.csv
            deliverables/taskA_holidays/output/trading_holidays_CME.csv
            deliverables/taskA_holidays/output/validation_report.md
            deliverables/taskA_holidays/output/validation_checks.json
            deliverables/taskA_holidays/output/run_meta.json
            deliverables/taskA_holidays/output/upload_manifest.json
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi
          git commit -m "Fetch trading-holiday calendars"
          git push

      - name: Alert on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        working-directory: deliverables/taskA_holidays
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          summary=$(grep -E '^\| .* \| (FAIL|WARN) \|' output/validation_report.md | head -10 || true)
          payload=$(jq -n --arg t "trading-holidays run ${{ github.run_id }} failed (${{ steps.run.outputs.status || 'unknown' }}) on ${{ github.repository }}" \
                          --arg s "$summary" \
                          --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                          '{text: ($t + "\n" + $s + "\n" + $u)}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
